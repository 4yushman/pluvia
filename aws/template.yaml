AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Minimal PLUVIA closed-choice report intake API, with a single Lambda,
  on-demand DynamoDB table, and retained Lambda log group.

Parameters:
  AllowedOrigin:
    Type: String
    Description: Exact browser origin serving form.html, including scheme and optional port, with no path or trailing slash.
    AllowedPattern: '^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$'
    ConstraintDescription: Supply one HTTP or HTTPS hostname and optional port only, without a path, wildcard, credentials, or trailing slash.

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-verification-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type

  VerificationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt VerificationFunction.Arn
      PayloadFormatVersion: '2.0'

  VerificationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /verifications'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${VerificationIntegration}'

  VerificationStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - VerificationRoute
      - ApiInvokePermission
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  VerificationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-reports'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  VerificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-verification'
      RetentionInDays: 14

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: pluvia-verification-minimum
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt VerificationTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${VerificationLogGroup.Arn}:*'

  VerificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-verification'
      Description: Accepts one allowlisted event ID and one closed-choice observation.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 128
      Timeout: 10
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref VerificationTable
      Code:
        ZipFile: |
          """Minimal, closed-choice PLUVIA verification intake handler."""

          import base64
          import binascii
          import json
          import logging
          import os
          import time
          import uuid
          from datetime import datetime, timezone

          LOGGER = logging.getLogger()
          LOGGER.setLevel(logging.INFO)

          # These IDs are the event IDs in app/card_data.json for this snapshot.
          ALLOWED_EVENT_IDS = frozenset({"R1-primary", "R2", "R3", "backup"})
          ALLOWED_OBSERVATIONS = frozenset(
              {"water_visible", "no_water_visible", "not_sure"}
          )
          _TABLE = None


          def _request_id(context):
              return getattr(context, "aws_request_id", None) or "unavailable"


          def _log(context, outcome):
              # Never include the submitted body, event ID, observation, or exception text.
              LOGGER.info(
                  json.dumps(
                      {"requestId": _request_id(context), "outcome": outcome},
                      separators=(",", ":"),
                  )
              )


          def _response(status_code, body):
              return {
                  "statusCode": status_code,
                  "headers": {
                      "content-type": "application/json; charset=utf-8",
                      "cache-control": "no-store",
                  },
                  "body": json.dumps(body, separators=(",", ":")),
              }


          def _decode_body(event):
              if not isinstance(event, dict):
                  return None
              body = event.get("body")
              if not isinstance(body, str):
                  return None
              if event.get("isBase64Encoded") is True:
                  try:
                      return base64.b64decode(body, validate=True).decode("utf-8")
                  except (binascii.Error, UnicodeDecodeError, ValueError):
                      return None
              return body


          def _get_table():
              global _TABLE
              if _TABLE is None:
                  import boto3

                  _TABLE = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
              return _TABLE


          def handler(event, context):
              body = _decode_body(event)
              if body is None:
                  _log(context, "invalid_request")
                  return _response(400, {"error": "invalid_request"})

              try:
                  payload = json.loads(body)
              except json.JSONDecodeError:
                  _log(context, "invalid_request")
                  return _response(400, {"error": "invalid_request"})

              if not isinstance(payload, dict) or set(payload) != {"eventId", "observation"}:
                  _log(context, "invalid_request")
                  return _response(400, {"error": "invalid_request"})

              event_id = payload["eventId"]
              observation = payload["observation"]
              if not isinstance(event_id, str) or event_id not in ALLOWED_EVENT_IDS:
                  _log(context, "invalid_event_id")
                  return _response(400, {"error": "invalid_event_id"})
              if not isinstance(observation, str) or observation not in ALLOWED_OBSERVATIONS:
                  _log(context, "invalid_observation")
                  return _response(400, {"error": "invalid_observation"})

              received_at = (
                  datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z")
              )
              submission_id = str(uuid.uuid4())
              item = {
                  "PK": f"EVENT#{event_id}",
                  "SK": f"REPORT#{received_at}#{submission_id}",
                  "eventId": event_id,
                  "observation": observation,
                  "evidenceType": "reported",
                  "receivedAt": received_at,
                  "submissionId": submission_id,
                  "expiresAt": int(time.time()) + 30 * 24 * 60 * 60,
              }

              try:
                  _get_table().put_item(
                      Item=item,
                      ConditionExpression="attribute_not_exists(PK) AND attribute_not_exists(SK)",
                  )
              except Exception:
                  # Do not emit exception details; SDK errors can contain request data.
                  _log(context, "write_failed")
                  return _response(500, {"error": "storage_unavailable"})

              _log(context, "accepted")
              return _response(
                  201,
                  {
                      "status": "received",
                      "evidenceType": "reported",
                      "receivedAt": received_at,
                      "submissionId": submission_id,
                  },
              )

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VerificationFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/verifications'

Outputs:
  ApiUrl:
    Description: HTTP API base URL. Append /verifications for submissions.
    Value: !GetAtt HttpApi.ApiEndpoint
  TableName:
    Description: DynamoDB table storing closed-choice reports.
    Value: !Ref VerificationTable
  LogGroupName:
    Description: Lambda log group with 14-day retention.
    Value: !Ref VerificationLogGroup
